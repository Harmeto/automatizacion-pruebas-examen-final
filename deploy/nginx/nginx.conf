# Balanceador del ambiente de prueba.
#
# Es la pieza que hace posible el Blue-Green: todo el tráfico entra por aquí y
# se reenvía al slot que esté activo. Conmutar de versión no significa reiniciar
# la aplicación, sino cambiar a dónde apunta este proxy y recargarlo, lo que
# ocurre sin cortar el servicio.

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Tiempos cortos: si el slot activo deja de responder, se nota de inmediato
    # en vez de quedar la petición colgada.
    proxy_connect_timeout 3s;
    proxy_send_timeout   10s;
    proxy_read_timeout   10s;

    # El destino vive en un archivo aparte que reescribe el script de
    # conmutación. Es el único punto que cambia al desplegar o al revertir.
    include /etc/nginx/conf.d/activo.conf;
}
