# ============================================================================
# Configuración de la aplicación bajo prueba
#
# Los valores sensibles al entorno (puerto, slot, metadatos de build) se leen
# de variables de entorno con un valor por defecto para desarrollo local. Es
# el principio de "configuración del entorno" de la Unidad I (ME_2-3 §2.3):
# el mismo artefacto sirve en local, en CI y en los slots blue y green.
# ============================================================================

spring.application.name=gestor-tareas
server.port=${SERVER_PORT:8080}

# Base de datos en memoria: cada arranque parte de un estado conocido, lo que
# garantiza la idempotencia de las suites de prueba (ME_3-3 §3.2).
spring.datasource.url=jdbc:h2:mem:tareas;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Metadatos de auditoría del despliegue (ME_6-3 §5.3).
info.app.version=@project.version@

# Health check consumido por el script de despliegue Blue-Green para decidir
# si el slot recién levantado está sano antes de conmutar el tráfico.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
